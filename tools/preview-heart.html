<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#eef8ef}#w{width:100%;height:100%}</style></head>
<body><div id="w"><canvas id="c" style="width:100%;height:100%"></canvas></div>
<script src="../js/vendor/three.js"></script><script src="../js/vendor/OrbitControls.js"></script>
<script src="../js/data.js"></script><script src="../js/heart3d.js"></script>
<script>
const q=new URLSearchParams(location.search);
window.h=new CJ.Heart3D(document.getElementById('c'));
h.setBeat(false);
if(q.get('cut')) h.setCut(+q.get('cut'));
if(q.get('alpha')) h.setAlpha(+q.get('alpha'));
if(q.get('az')){const a=+q.get('az');const d=h.camera.position.clone().sub(h.controls.target);d.applyAxisAngle(new THREE.Vector3(0,1,0),a);h.camera.position.copy(h.controls.target).add(d);h.controls.update();}
</script></body></html>
